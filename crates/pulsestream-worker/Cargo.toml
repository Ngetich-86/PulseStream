[package]
name = "pulsestream-worker"
description = "PulseStream bounded event processing (library) and worker process (binary)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Deterministic test processors for this and dependent crates' tests.
test-util = ["dep:serde_json"]

[dependencies]
pulsestream-core.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
